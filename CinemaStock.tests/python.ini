[pytest]
addopts = --base-url=http://localhost:7001 --headed --browser-channel=chrome --alluredir=allure-results
testpaths=tests
asyncio_mode=auto
asyncio_default_fixture_loop_scope=session
markers=
    ui: Тесты пользовательского интерфейса
    api: Тесты API
    smoke: критически важные тесты (дымовое тестирование)
    regress: регресс
api_url = http://localhost:7000
